pluginManagement { includeBuild("../node_modules/@react-native/gradle-plugin") }
plugins { id("com.facebook.react.settings") }
extensions.configure(com.facebook.react.ReactSettingsExtension){ ex -> ex.autolinkLibrariesFromCommand() }
rootProject.name = 'MedicalFrontend'
include ':app'
includeBuild('../node_modules/@react-native/gradle-plugin')
include ':react-native-linear-gradient'
project(':react-native-linear-gradient').projectDir = new File(rootProject.projectDir, '../node_modules/react-native-linear-gradient/android')

include ':react-native-reanimated'
project(':react-native-reanimated').projectDir =
        new File(rootProject.projectDir, '../node_modules/react-native-reanimated/android')

include ':react-native-geolocation-service'
project(':react-native-geolocation-service').projectDir =
        new File(rootProject.projectDir, '../node_modules/react-native-geolocation-service/android')
